[project]
name = "e-comerce"
version = "1.0.0"
description = "Pipeline de Engenharia de Dados para E-commerce com Google Cloud, BigQuery, dbt e Power BI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dbt-bigquery>=1.12.1",
    "dbt-core>=1.12.5",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "sqlfluff>=4.4.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
